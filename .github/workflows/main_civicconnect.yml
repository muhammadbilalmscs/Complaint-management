# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - CivicConnect

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install, build, and test
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --watch=false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/dist/civic-connect/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E40F8732DB0447C59C4DAD8FEF5E668B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2FECD6A136245528E346719B7474636 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_481F6E9CAF4C430FB3FAB042528673B4 }}

      - name: Set the Linux startup command
        run: |
          resource_group=$(az webapp list --query "[?name=='CivicConnect'].resourceGroup | [0]" -o tsv)
          if [ -z "$resource_group" ]; then
            echo "Could not find the CivicConnect App Service in this subscription."
            exit 1
          fi
          az webapp config set \
            --name CivicConnect \
            --resource-group "$resource_group" \
            --startup-file "node server.js"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CivicConnect'
          slot-name: 'Production'
          package: release
